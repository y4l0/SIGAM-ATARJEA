{% extends "layout.html" %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-user-{{ 'edit' if usuario else 'plus' }} me-2"></i>
                        {{ 'Editar Usuario' if usuario else 'Nuevo Usuario' }}
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" name="nombre" class="form-control" required
                                   value="{{ usuario.nombre if usuario else '' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo electrónico (Gmail para login con Google)</label>
                            <input type="email" name="email" class="form-control" required
                                   value="{{ usuario.email if usuario else '' }}"
                                   placeholder="director@gmail.com">
                            <small class="text-muted">
                                Debe coincidir EXACTAMENTE con la cuenta de Gmail / Google Workspace del director.
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Contraseña {{ '(dejar en blanco para no cambiarla)' if usuario else '' }}
                            </label>
                            <input type="password" name="password" class="form-control"
                                   {% if not usuario %}required{% endif %}>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Rol</label>
                                <select name="rol" class="form-select">
                                    {% set rol_actual = usuario.rol if usuario else 'Director' %}
                                    <option value="Director" {% if rol_actual == 'Director' %}selected{% endif %}>Director</option>
                                    <option value="Admin" {% if rol_actual == 'Admin' %}selected{% endif %}>Administrador</option>
                                    <option value="Operador" {% if rol_actual == 'Operador' %}selected{% endif %}>Operador</option>
                                    <option value="Presidente" {% if rol_actual == 'Presidente' %}selected{% endif %}>Presidente Municipal</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Dependencia</label>
                                <select name="dependencia_id" class="form-select">
                                    <option value="">-- Ninguna --</option>
                                    {% for dep in dependencias %}
                                    <option value="{{ dep.id }}"
                                        {% if usuario and usuario.dependencia_id == dep.id %}selected{% endif %}>
                                        {{ dep.nombre }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" name="activo" id="activo"
                                   {% if not usuario or usuario.activo %}checked{% endif %}>
                            <label class="form-check-label" for="activo">Usuario activo</label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('main.admin_usuarios') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
